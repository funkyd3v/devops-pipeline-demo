# Example inventory: copy this file to inventory.ini (gitignored) and adjust.
#
#   cp inventory.example.ini inventory.ini
#
# In this stage the "server" is the container started from target/docker-compose.yml,
# so the address is loopback and the port is the one published there. On a real VM
# it would be <SERVER_IP> with the default SSH port 22.

[target]
demo-server ansible_host=127.0.0.1 ansible_port=2222 ansible_user=bootstrap
# Private key whose public half is mounted into the target. Placeholder on
# purpose - point it at your own key file, never commit a key.
demo-server ansible_ssh_private_key_file=<PATH_TO_PRIVATE_KEY>
# Host keys go to a repo-local, gitignored file instead of ~/.ssh/known_hosts.
# Quoted because the value contains spaces; use an absolute path (ssh resolves
# relative paths against the CWD).
demo-server ansible_ssh_common_args='-o UserKnownHostsFile=<ABS_PATH_TO_REPO>/ansible/known_hosts'
