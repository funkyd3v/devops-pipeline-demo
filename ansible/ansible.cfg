[defaults]
# The real inventory is gitignored (it holds machine-specific host details).
# Start from the committed example:  cp inventory.example.ini inventory.ini
inventory = inventory.ini

# Local lab only. The target's host key is trusted on first contact and checked
# from then on, so a rebuilt/replaced container is still detected. The keys are
# recorded in the gitignored ansible/known_hosts file named per host in the
# inventory (ansible_ssh_common_args), never in ~/.ssh/known_hosts.
host_key_checking = accept-new

# Don't drop .retry files in the repo after a failed run.
retry_files_enabled = False

# Quiet the "discovered Python interpreter" notice; python3 is installed here.
interpreter_python = auto_silent
